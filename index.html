<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Thread</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

:root{
  --bg:#f8f6f2; --surface:#ffffff; --surface-raised:#f0ede7;
  --text:#2b2a28; --text-dim:#8c887f; --accent:#c98f2e;
  --sent:#6c5c96; --sent-text:#ffffff; --received:#f0ede7;
  --divider:#e6e1d8; --online:#4caf82; --danger:#c85c4d;
  --shadow: 0 1px 3px rgba(0,0,0,0.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}
input, textarea{ -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;-webkit-font-smoothing:antialiased;}
#app{width:100%;max-width:420px;height:100vh;height:100dvh;max-height:844px;position:relative;overflow:hidden;overscroll-behavior:contain;display:flex;flex-direction:column;border-left:1px solid var(--divider);border-right:1px solid var(--divider);
  background-image:linear-gradient(rgba(248,246,242,0.55), rgba(248,246,242,0.55)), url('background.png');
  background-size:cover;
  background-position:center;
}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:transparent;}

/* Sign-in screen */
#signin-screen{justify-content:center;align-items:center;padding:32px 28px;text-align:center;}
.signin-eyebrow{color:var(--accent);font-size:13px;font-weight:600;margin-bottom:8px;}
#signin-screen h1{font-family:'Fraunces',serif;font-weight:600;font-size:30px;margin-bottom:10px;}
#signin-screen p{color:var(--text-dim);font-size:14px;line-height:1.5;margin-bottom:28px;max-width:300px;}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:1px solid var(--divider);border-radius:10px;padding:13px 20px;font-weight:600;font-size:15px;color:var(--text);cursor:pointer;box-shadow:var(--shadow);}
.google-btn:active{transform:scale(.98);}

/* Conversations list */
.list-header{display:flex;align-items:center;gap:10px;padding:18px 16px 12px;border-bottom:1px solid var(--divider);background:var(--surface);flex-shrink:0;}
.list-header h1{font-family:'Fraunces',serif;font-weight:600;font-size:24px;flex:1;}
.avatar-img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--surface-raised);}
.new-chat-bar{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--divider);background:var(--surface);flex-shrink:0;}
.new-chat-bar input{flex:1;background:var(--surface-raised);border:none;border-radius:10px;padding:11px 14px;font-size:14px;outline:none;color:var(--text);}
.new-chat-bar button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:0 16px;font-weight:600;font-size:13px;cursor:pointer;}
.new-chat-bar button:disabled{opacity:.4;}

.convo-list{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
.convo-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--divider);cursor:pointer;}
.convo-row:active{background:var(--surface-raised);}
.convo-avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--surface-raised);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;color:var(--accent);}
.convo-meta{flex:1;min-width:0;}
.convo-name{font-size:15px;font-weight:600;}
.convo-preview{font-size:13px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.convo-empty{margin:auto;text-align:center;color:var(--text-dim);font-size:13.5px;padding:40px 30px;line-height:1.6;}

/* Thread */
.thread-header{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--divider);flex-shrink:0;background:var(--surface);}
.back-btn{background:transparent;border:none;color:var(--text);cursor:pointer;padding:6px;display:flex;align-items:center;justify-content:center;}
.thread-id{flex:1;min-width:0;}
.thread-name{font-size:15px;font-weight:600;color:var(--text);}
.thread-status{font-size:12px;color:var(--text-dim);margin-top:1px;display:flex;align-items:center;gap:5px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--online);flex-shrink:0;}
.icon-btn{background:transparent;border:none;color:var(--text);cursor:pointer;padding:6px;display:flex;align-items:center;justify-content:center;border-radius:50%;}
.icon-btn:active{background:var(--surface-raised);}

.messages{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px 14px 8px;display:flex;flex-direction:column;gap:4px;}
.empty-state{margin:auto;text-align:center;color:var(--text-dim);font-size:13.5px;padding:0 30px;line-height:1.6;}

.bubble-wrap{display:flex;flex-direction:column;max-width:78%;margin:6px 0;}
.bubble-wrap.me{align-self:flex-end;align-items:flex-end;}
.bubble-wrap.them{align-self:flex-start;align-items:flex-start;}

.bubble{padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.4;animation:rise .2s ease both;word-wrap:break-word;box-shadow:var(--shadow);cursor:pointer;}
@keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.bubble-wrap.them .bubble{background:var(--received);border-bottom-left-radius:5px;color:var(--text);}
.bubble-wrap.me .bubble{background:var(--sent);border-bottom-right-radius:5px;color:var(--sent-text);}
.bubble-time{font-size:10.5px;color:var(--text-dim);margin:3px 4px 0;}

.reply-quote{border-left:3px solid var(--accent);padding:4px 8px;margin-bottom:6px;font-size:12px;opacity:.85;border-radius:4px;background:rgba(0,0,0,0.04);}
.bubble-wrap.me .reply-quote{background:rgba(255,255,255,0.15);}
.reply-quote .who{font-weight:600;}

.bubble img.media-img{max-width:220px;max-height:280px;border-radius:12px;display:block;}
.voice-row{display:flex;align-items:center;gap:8px;min-width:180px;}
.voice-row audio{height:34px;max-width:170px;}

.msg-actions{display:flex;gap:10px;margin-top:4px;font-size:11.5px;}
.msg-actions button{background:none;border:none;color:var(--accent);font-size:11.5px;cursor:pointer;padding:2px 4px;font-weight:600;}
.msg-actions button.danger{color:var(--danger);}

.reply-preview-bar{display:none;align-items:center;gap:8px;padding:8px 14px;background:var(--surface-raised);border-top:1px solid var(--divider);}
.reply-preview-bar.show{display:flex;}
.reply-preview-bar .content{flex:1;min-width:0;font-size:12.5px;border-left:3px solid var(--accent);padding-left:8px;}
.reply-preview-bar .content .who{font-weight:600;}
.reply-preview-bar .cancel{background:none;border:none;color:var(--text-dim);font-size:18px;cursor:pointer;padding:2px 6px;}

.composer{display:flex;align-items:center;gap:6px;padding:10px 12px;border-top:1px solid var(--divider);flex-shrink:0;background:var(--surface);}
.composer input[type="text"]{flex:1;background:var(--surface-raised);border:none;border-radius:20px;padding:11px 16px;color:var(--text);font-size:14.5px;outline:none;}
.composer input::placeholder{color:var(--text-dim);}
.composer .icon-btn{color:var(--text-dim);}
.send-btn{width:38px;height:38px;border-radius:50%;background:var(--accent);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:#fff;}
.send-btn:disabled{opacity:.35;}
.send-btn svg{transform:translateX(-1px);}
.mic-btn.recording{background:var(--danger);color:#fff;border-radius:50%;animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,92,77,.4);}50%{box-shadow:0 0 0 8px rgba(200,92,77,0);}}
.record-timer{font-size:12px;color:var(--danger);font-weight:600;padding:0 4px;min-width:34px;text-align:center;}

.toast{position:absolute;bottom:78px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:20;white-space:nowrap;max-width:90%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.incoming-call{position:absolute;top:0;left:0;right:0;background:var(--surface-raised);padding:14px 16px;display:none;align-items:center;gap:10px;z-index:15;border-bottom:1px solid var(--divider);}
.incoming-call.show{display:flex;}
.incoming-call .info{flex:1;}
.incoming-call .info .who{font-weight:600;font-size:14px;}
.incoming-call .info .what{font-size:12px;color:var(--text-dim);}
.call-action{width:38px;height:38px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.call-action.accept{background:var(--online);color:#0d1a12;}
.call-action.decline{background:var(--danger);color:#2a0f0a;}

#call-overlay{position:absolute;inset:0;background:#0a0a10;z-index:30;display:none;flex-direction:column;}
#call-overlay.show{display:flex;}
.call-status-bar{padding:14px 16px;text-align:center;color:#9498a8;font-size:13px;flex-shrink:0;}
.video-stage{flex:1;position:relative;background:#000;}
#remote-video{width:100%;height:100%;object-fit:cover;}
#local-video{position:absolute;bottom:16px;right:16px;width:96px;height:128px;border-radius:12px;object-fit:cover;background:#1c1e28;border:2px solid rgba(255,255,255,.15);}
.call-controls{display:flex;justify-content:center;gap:20px;padding:24px 16px 32px;flex-shrink:0;}
.control-btn{width:56px;height:56px;border-radius:50%;background:#262838;border:none;display:flex;align-items:center;justify-content:center;color:#ededef;cursor:pointer;}
.control-btn.off{background:#ededef;color:#14151c;}
.control-btn.hangup{background:var(--danger);color:#fff;}

.messages::-webkit-scrollbar,.convo-list::-webkit-scrollbar{width:0;}
</style>
</head>
<body>

<div id="app">

  <!-- Sign-in -->
  <div class="screen" id="signin-screen">
    <div class="signin-eyebrow">Crazy Chat</div>
    <h1>Sign in to start</h1>
    <p>Sign in with Google, then message anyone else who's also signed in — no room codes needed.</p>
    <button class="google-btn" id="google-signin-btn">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.66-.22-2.45H12v4.63h6.47c-.28 1.5-1.13 2.77-2.4 3.62v3h3.87c2.27-2.09 3.58-5.17 3.58-8.8z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.9l-3.87-3c-1.08.72-2.46 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.28v3.09C3.25 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.29c-.24-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.28A11.96 11.96 0 000 12c0 1.94.46 3.77 1.28 5.38l3.99-3.09z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.7 1.28 6.62l3.99 3.09C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
      Sign in with Google
    </button>
  </div>

  <!-- Conversations list -->
  <div class="screen" id="list-screen" style="display:none;">
    <div class="list-header">
      <h1>Chats</h1>
      <button class="icon-btn" id="signout-btn" title="Sign out">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
      <img class="avatar-img" id="my-avatar" src="" alt="">
    </div>
    <div class="new-chat-bar">
      <input type="email" id="new-chat-email" placeholder="Start a chat by email">
      <button id="new-chat-btn" disabled>Start</button>
    </div>
    <div class="convo-list" id="convo-list">
      <div class="convo-empty">No conversations yet. Start one above using someone's email — they need to have signed in at least once too.</div>
    </div>
  </div>

  <!-- Thread -->
  <div class="screen" id="thread-screen" style="display:none;">
    <div class="incoming-call" id="incoming-call">
      <div class="info"><div class="who" id="caller-name"></div><div class="what">Incoming call</div></div>
      <button class="call-action decline" id="decline-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a1.005 1.005 0 01-.29-.7c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .27-.11.52-.29.7l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28a11.5 11.5 0 00-2.66-1.85.999.999 0 01-.56-.9v-3.1A17 17 0 0012 9z" transform="rotate(135 12 12)"/></svg>
      </button>
      <button class="call-action accept" id="accept-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
      </button>
    </div>

    <div class="thread-header">
      <button class="back-btn" id="thread-back-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="thread-id">
        <div class="thread-name" id="thread-name-label"></div>
        <div class="thread-status"><span class="live-dot"></span><span>Live</span></div>
      </div>
      <button class="icon-btn" id="call-btn" title="Start call">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
      </button>
    </div>

    <div class="messages" id="messages"><div class="empty-state" id="empty-state">No messages yet. Say hi.</div></div>

    <div class="reply-preview-bar" id="reply-preview-bar">
      <div class="content"><div class="who" id="reply-preview-who"></div><div id="reply-preview-text"></div></div>
      <button class="cancel" id="reply-cancel-btn">&times;</button>
    </div>

    <div class="composer">
      <input type="file" id="image-input" accept="image/*" style="display:none;">
      <button class="icon-btn" id="attach-btn" title="Send a photo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </button>
      <span class="record-timer" id="record-timer" style="display:none;">0:00</span>
      <input type="text" id="msg-input" placeholder="Message" autocomplete="off" maxlength="500">
      <button class="icon-btn mic-btn" id="mic-btn" title="Record a voice note">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-3.08A7 7 0 0019 11h-2z"/></svg>
      </button>
      <button class="send-btn" id="send-btn" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
      </button>
    </div>
    <div class="toast" id="toast"></div>
  </div>

  <div id="call-overlay">
    <div class="call-status-bar" id="call-status-bar">Calling…</div>
    <div class="video-stage">
      <video id="remote-video" autoplay playsinline></video>
      <video id="local-video" autoplay playsinline muted></video>
    </div>
    <div class="call-controls">
      <button class="control-btn" id="toggle-mic-btn" title="Mute">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-3.08A7 7 0 0019 11h-2z"/></svg>
      </button>
      <button class="control-btn" id="toggle-cam-btn" title="Camera">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h12a1 1 0 001-1v-3.5l4 4v-11l-4 4z"/></svg>
      </button>
      <button class="control-btn hangup" id="hangup-btn" title="End call">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a1.005 1.005 0 01-.29-.7c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .27-.11.52-.29.7l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28a11.5 11.5 0 00-2.66-1.85.999.999 0 01-.56-.9v-3.1A17 17 0 0012 9z"/></svg>
      </button>
    </div>
  </div>

</div>

// ---------- Audio (ringtone + notification) ----------
let audioCtx = null;
let ringtoneTimer = null;
function getAudioCtx(){ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }
function playRingBurst(freq1, freq2, duration){
  const ctx = getAudioCtx(); const now = ctx.currentTime;
  [freq1, freq2].forEach(freq => {
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.12, now + 0.05);
    gain.gain.setValueAtTime(0.12, now + duration - 0.1);
    gain.gain.linearRampToValueAtTime(0.001, now + duration);
    osc.connect(gain).connect(ctx.destination); osc.start(now); osc.stop(now + duration);
  });
}
function startIncomingRingtone(){ stopRingtone(); const r=()=>playRingBurst(480,440,1.6); r(); ringtoneTimer=setInterval(r,2800); }
function startOutgoingRingback(){ stopRingtone(); const r=()=>playRingBurst(440,480,1.8); r(); ringtoneTimer=setInterval(r,3600); }
function stopRingtone(){ if(ringtoneTimer){ clearInterval(ringtoneTimer); ringtoneTimer=null; } }
function playMessageTone(){
  const ctx = getAudioCtx(); const now = ctx.currentTime;
  [880, 1318.5].forEach((freq, i) => {
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    const start = now + i * 0.09;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.linearRampToValueAtTime(0.18, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.25);
    osc.connect(gain).connect(ctx.destination); osc.start(start); osc.stop(start + 0.3);
  });
}
function showToast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'), 2500); }
function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
function formatTime(ts){ return new Date(ts).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }

const voiceUrlCache = new Map();
function dataUrlToBlob(dataUrl){
  const [header, base64] = dataUrl.split(',');
  const mimeMatch = header.match(/data:(.*?);base64/);
  const mime = mimeMatch ? mimeMatch[1] : 'audio/wav';
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}
function getVoiceObjectUrl(m){
  if(voiceUrlCache.has(m._id)) return voiceUrlCache.get(m._id);
  try{
    const url = URL.createObjectURL(dataUrlToBlob(m.data));
    voiceUrlCache.set(m._id, url);
    return url;
  }catch(e){
    return m.data; // fall back to the raw data URI if conversion fails
  }
}
function clearVoiceUrlCache(){
  voiceUrlCache.forEach(url => URL.revokeObjectURL(url));
  voiceUrlCache.clear();
}

function handleUserLogin(user) {
  myUid = user.uid;
  myName = user.displayName || user.email || 'Someone';
  myPhoto = user.photoURL || '';

  myAvatarEl.src = myPhoto;
  signinScreen.style.display = 'none';
  threadScreen.style.display = 'none';
  listScreen.style.display = 'flex';
  listenToConversations();

    db.ref('emailIndex/' + emailKey(user.email)).set(myUid).catch(e => console.error(e));
  }

  setupPushNotifications();
}

      vapidKey: 'BBJu6-IIqRYyOXikXOD5-41ZNv416XF_IH_9Ly4_wHofmbOKFS-OLs18YpmIa1p-zC-UEpvs9QkKVzJ1XfrWXpU',
      serviceWorkerRegistration: registration
    });
    if(token){

}

// ---------- Conversations list ----------
function listenToConversations(){
  convoListRef = db.ref('userConversations/' + myUid);
  convoListRef.on('value', snap => {
    const val = snap.val() || {};
    const arr = Object.values(val).sort((a,b) => (b.lastTs||0) - (a.lastTs||0));
    renderConvoList(arr);
  });
}
function renderConvoList(arr){
  convoListEl.innerHTML = '';
  if(arr.length === 0){
    convoListEl.innerHTML = '<div class="convo-empty">No conversations yet. Start one above using someone\'s email — they need to have signed in at least once too.</div>';
    return;
  }
  arr.forEach(c => {
    const row = document.createElement('div');
    row.className = 'convo-row';
    const avatarHtml = c.otherPhoto
      ? `<img class="convo-avatar" src="${c.otherPhoto}" alt="">`
      : `<div class="convo-avatar">${initials(c.otherName)}</div>`;
    row.innerHTML = `${avatarHtml}<div class="convo-meta"><div class="convo-name">${escapeHtml(c.otherName)}</div><div class="convo-preview">${escapeHtml(c.lastMessage || 'Say hi')}</div></div>`;
    row.addEventListener('click', () => openConversation(c.convoId, c.otherName));
    convoListEl.appendChild(row);
  });
}

newChatEmail.addEventListener('input', () => { newChatBtn.disabled = !newChatEmail.value.includes('@'); });
newChatBtn.addEventListener('click', startNewChat);

async function startNewChat(){
  const email = newChatEmail.value.trim();
  if(!email) return;
  const key = emailKey(email);
  try{
    const snap = await db.ref('emailIndex/' + key).once('value');
    if(!snap.exists()){
      showToast("No one with that email has signed in yet");
      return;
    }
    const otherUid = snap.val();
    if(otherUid === myUid){ showToast("That's your own email"); return; }
    const otherUserSnap = await db.ref('users/' + otherUid).once('value');
    const otherUser = otherUserSnap.val() || {};
    const convoId = [myUid, otherUid].sort().join('_');

    await db.ref('userConversations/' + myUid + '/' + convoId).update({
      convoId, otherUid, otherName: otherUser.name || 'Unknown', otherPhoto: otherUser.photo || '', lastTs: Date.now()
    });
    await db.ref('userConversations/' + otherUid + '/' + convoId).update({
      convoId, otherUid: myUid, otherName: myName, otherPhoto: myPhoto, lastTs: Date.now()
    });

    newChatEmail.value = '';
    newChatBtn.disabled = true;
    openConversation(convoId, otherUser.name || 'Unknown');
  }catch(e){
    showToast("Couldn't start chat — try again");
  }
}

// ---------- Opening a conversation ----------
function openConversation(convoId, otherName){
  currentConvoId = convoId;
  otherPersonName = otherName;
  threadNameLabel.textContent = otherName;
  listScreen.style.display = 'none';
  threadScreen.style.display = 'flex';

  clearVoiceUrlCache();
  seenMessageIds = new Set();
  messagesLoadedOnce = false;

  if(messagesRef) messagesRef.off();
  if(callRef) callRef.off();

  messagesRef = db.ref('conversations/' + convoId + '/messages');
  messagesRef.on('value', snap => {
    const val = snap.val() || {};
    const arr = Object.entries(val).map(([id, m]) => ({ ...m, _id: id })).sort((a,b) => a.ts - b.ts);
    if(messagesLoadedOnce){
      arr.forEach(m => { if(!seenMessageIds.has(m._id) && m.fromUid !== myUid) playMessageTone(); });
    }
    arr.forEach(m => seenMessageIds.add(m._id));
    messagesLoadedOnce = true;
    renderMessages(arr);
  });

  callRef = db.ref('conversations/' + convoId + '/call');
  callRef.on('value', handleCallStateChange);

  input.focus();
}

// ---------- Reply ----------
function setReply(msg){
  replyingTo = { from: msg.fromUid === myUid ? myName : otherPersonName, snippet: replySnippet(msg) };
  replyWhoEl.textContent = replyingTo.from;
  replyTextEl.textContent = replyingTo.snippet;
  replyBar.classList.add('show');
  input.focus();
}
function replySnippet(msg){
  if(msg.type === 'image') return 'Photo';
  if(msg.type === 'voice') return 'Voice message';
  return (msg.text || '').slice(0, 60);
}
function clearReply(){ replyingTo = null; replyBar.classList.remove('show'); }
replyCancelBtn.addEventListener('click', clearReply);

// ---------- Message actions ----------
function toggleActions(id){ openActionsId = (openActionsId === id) ? null : id; renderMessages(lastRenderedArr); }
function deleteMessage(id){ if(!confirm('Delete this message?')) return; messagesRef.child(id).remove(); }
function saveMedia(dataUrl, filename){
  try{
    const a = document.createElement('a'); a.href = dataUrl; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ showToast("Couldn't save — try a long-press on the media instead"); }
}

function updateConvoPreview(text){
  const otherUid = currentConvoId.split('_').find(id => id !== myUid);
  const now = Date.now();
  db.ref('userConversations/' + myUid + '/' + currentConvoId).update({ lastMessage: text, lastTs: now }).catch(()=>{});
  db.ref('userConversations/' + otherUid + '/' + currentConvoId).update({ lastMessage: text, lastTs: now }).catch(()=>{});
}

// ---------- Rendering ----------
function renderMessages(arr){
  lastRenderedArr = arr;
  const wasNearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
  messagesEl.innerHTML = '';
  if(arr.length === 0){ messagesEl.appendChild(emptyState); return; }

  arr.forEach(m => {
    const isMe = m.fromUid === myUid;
    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap ' + (isMe ? 'me' : 'them');

    let bodyHtml = '';
    if(m.replyTo) bodyHtml += `<div class="reply-quote"><div class="who">${escapeHtml(m.replyTo.from)}</div>${escapeHtml(m.replyTo.snippet)}</div>`;

    if(m.type === 'image'){
      bodyHtml += `<img class="media-img" src="${m.data}" alt="Shared photo">`;
    } else if(m.type !== 'voice'){
      bodyHtml += escapeHtml(m.text || '');
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = bodyHtml;

    if(m.type === 'voice'){
      const voiceRow = document.createElement('div');
      voiceRow.className = 'voice-row';
      const audioEl = document.createElement('audio');
      audioEl.controls = true;
      audioEl.preload = 'metadata';
      audioEl.src = getVoiceObjectUrl(m);
      voiceRow.appendChild(audioEl);
      bubble.appendChild(voiceRow);
    }

    bubble.addEventListener('click', () => toggleActions(m._id));
    wrap.appendChild(bubble);

    const timeEl = document.createElement('div');
    timeEl.className = 'bubble-time';
    timeEl.textContent = formatTime(m.ts);
    wrap.appendChild(timeEl);

    if(openActionsId === m._id){
      const actions = document.createElement('div');
      actions.className = 'msg-actions';
      let actionsHtml = `<button data-action="reply">Reply</button>`;
      if(m.type === 'image' || m.type === 'voice') actionsHtml += `<button data-action="save">Save</button>`;
      if(isMe) actionsHtml += `<button data-action="delete" class="danger">Delete</button>`;
      actions.innerHTML = actionsHtml;
      actions.querySelector('[data-action="reply"]').addEventListener('click', (e) => { e.stopPropagation(); setReply(m); openActionsId=null; renderMessages(lastRenderedArr); });
      const saveBtnEl = actions.querySelector('[data-action="save"]');
      if(saveBtnEl) saveBtnEl.addEventListener('click', (e) => { e.stopPropagation(); const ext = m.type === 'image' ? 'jpg' : (m.data.includes('audio/wav') ? 'wav' : (m.data.includes('audio/mp4') ? 'm4a' : 'webm')); saveMedia(m.data, m.type === 'image' ? 'photo.jpg' : `voice-message.${ext}`); });
      const delBtnEl = actions.querySelector('[data-action="delete"]');
      if(delBtnEl) delBtnEl.addEventListener('click', (e) => { e.stopPropagation(); deleteMessage(m._id); });
      wrap.appendChild(actions);
    }
    messagesEl.appendChild(wrap);
  });
  if(wasNearBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
}

// ---------- Sending: text ----------
function sendMessage(){
  const text = input.value.trim();
  if(!text || !currentConvoId) return;
  const payload = { fromUid: myUid, fromName: myName, text, ts: Date.now() };
  if(replyingTo) payload.replyTo = replyingTo;
  messagesRef.push(payload).catch(() => showToast("Couldn't send — try again"));
  updateConvoPreview(text);
  input.value = '';
  sendBtn.disabled = true;
  clearReply();
}
input.addEventListener('input', () => { sendBtn.disabled = input.value.trim().length === 0; });
input.addEventListener('keydown', e => { if(e.key === 'Enter') sendMessage(); });
sendBtn.addEventListener('click', sendMessage);

// ---------- Sending: image ----------
attachBtn.addEventListener('click', () => imageInput.click());
imageInput.addEventListener('change', () => {
  const file = imageInput.files[0];
  if(!file) return;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = e => { img.src = e.target.result; };
  img.onload = () => {
    const maxDim = 720;
    let w = img.width, h = img.height;
    if(w > maxDim || h > maxDim){ const scale = maxDim / Math.max(w, h); w = Math.round(w*scale); h = Math.round(h*scale); }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
    const payload = { fromUid: myUid, fromName: myName, type: 'image', data: dataUrl, ts: Date.now() };
    if(replyingTo) payload.replyTo = replyingTo;
    messagesRef.push(payload).catch(() => showToast("Couldn't send photo — try again"));
    updateConvoPreview('Photo');
    clearReply();
  };
  reader.readAsDataURL(file);
  imageInput.value = '';
});

// ---------- Sending: voice ----------
let mediaRecorder = null, recordedChunks = [], recordStartTime = 0, recordTimerInterval = null;
function getSupportedMimeType(){
  const candidates = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/mp4;codecs=mp4a.40.2','audio/aac','audio/ogg;codecs=opus'];
  for(const t of candidates){ if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) return t; }
  return '';
}

function audioBufferToWavBlob(buffer){
  const sampleRate = buffer.sampleRate;
  const samples = buffer.getChannelData(0);
  const dataSize = samples.length * 2;
  const ab = new ArrayBuffer(44 + dataSize);
  const view = new DataView(ab);
  function writeString(offset, str){ for(let i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i)); }
  writeString(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeString(36, 'data');
  view.setUint32(40, dataSize, true);
  let offset = 44;
  for(let i = 0; i < samples.length; i++){
    let s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    offset += 2;
  }
  return new Blob([view], { type: 'audio/wav' });
}

async function convertToUniversalWav(rawBlob){
  const arrayBuffer = await rawBlob.arrayBuffer();
  const ctx = getAudioCtx();
  const decoded = await ctx.decodeAudioData(arrayBuffer);
  const targetRate = 16000;
  const OfflineCtx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const offlineCtx = new OfflineCtx(1, Math.ceil(decoded.duration * targetRate), targetRate);
  const src = offlineCtx.createBufferSource();
  src.buffer = decoded;
  src.connect(offlineCtx.destination);
  src.start(0);
  const rendered = await offlineCtx.startRendering();
  return audioBufferToWavBlob(rendered);
}
micBtn.addEventListener('click', async () => {
  if(mediaRecorder && mediaRecorder.state === 'recording'){ mediaRecorder.stop(); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recordedChunks = [];
    const mimeType = getSupportedMimeType();
    mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(recordTimerInterval);
      recordTimerEl.style.display = 'none';
      micBtn.classList.remove('recording');
      const actualType = mediaRecorder.mimeType || mimeType || 'audio/webm';
      const rawBlob = new Blob(recordedChunks, { type: actualType });
      if(rawBlob.size < 300) return;

      let finalBlob;
      try{
        finalBlob = await convertToUniversalWav(rawBlob);
      }catch(e){
        finalBlob = rawBlob; // fall back to native format if conversion fails
      }

      const reader = new FileReader();
      reader.onload = () => {
        const payload = { fromUid: myUid, fromName: myName, type: 'voice', data: reader.result, ts: Date.now() };
        if(replyingTo) payload.replyTo = replyingTo;
        messagesRef.push(payload).catch(() => showToast("Couldn't send voice note — try again"));
        updateConvoPreview('Voice message');
        clearReply();
      };
      reader.readAsDataURL(finalBlob);
    };
    mediaRecorder.start();
    micBtn.classList.add('recording');
    recordStartTime = Date.now();
    recordTimerEl.style.display = 'inline-block';
    recordTimerInterval = setInterval(() => {
      const secs = Math.floor((Date.now() - recordStartTime) / 1000);
      const m = Math.floor(secs/60), s = secs%60;
      recordTimerEl.textContent = `${m}:${s.toString().padStart(2,'0')}`;
      if(secs >= 60) mediaRecorder.stop();
    }, 250);
  }catch(e){ showToast("Couldn't access microphone — check permissions"); }
});

// ---------- Calling ----------
callBtn.addEventListener('click', () => startCall());

async function startCall(){
  if(callActive || !currentConvoId) return;
  try{
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
  }catch(e){ showToast("Couldn't access camera/mic — check permissions"); return; }
  openCallOverlay(true);
  pc = new RTCPeerConnection(ICE_SERVERS);
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  wireRemoteTrack();
  pc.onicecandidate = e => { if(e.candidate) callRef.child('callerCandidates').push(e.candidate.toJSON()); };
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await callRef.set({ status: 'ringing', callerUid: myUid, callerName: myName, offer: { sdp: offer.sdp, type: offer.type } });
  callStatusBar.textContent = 'Calling…';
  startOutgoingRingback();
}

let handledCallerCandidatesRef = null, handledCalleeCandidatesRef = null;

async function handleCallStateChange(snap){
  const data = snap.val();
  if(!data || data.status === 'ended' || data.status === undefined){
    stopRingtone();
    if(callActive) cleanupCall();
    incomingCallEl.classList.remove('show');
    return;
  }
  if(data.status === 'ringing' && data.callerUid !== myUid && !callActive && !pc){
    callerNameEl.textContent = data.callerName;
    incomingCallEl.classList.add('show');
    window._pendingOffer = data.offer;
    startIncomingRingtone();
    return;
  }
  if(data.status === 'connected' && data.answer && pc && pc.signalingState !== 'stable' && !pc.currentRemoteDescription){
    stopRingtone();
    await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
    callStatusBar.textContent = 'Connected';
    listenForCandidates('calleeCandidates');
  }
}

acceptBtn.addEventListener('click', async () => {
  stopRingtone();
  incomingCallEl.classList.remove('show');
  const offer = window._pendingOffer;
  if(!offer) return;
  try{
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
  }catch(e){ showToast("Couldn't access camera/mic — check permissions"); return; }
  openCallOverlay(false);
  pc = new RTCPeerConnection(ICE_SERVERS);
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  wireRemoteTrack();
  pc.onicecandidate = e => { if(e.candidate) callRef.child('calleeCandidates').push(e.candidate.toJSON()); };
  await pc.setRemoteDescription(new RTCSessionDescription(offer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  await callRef.update({ status: 'connected', answer: { sdp: answer.sdp, type: answer.type } });
  callStatusBar.textContent = 'Connected';
  listenForCandidates('callerCandidates');
});

declineBtn.addEventListener('click', () => {
  stopRingtone();
  incomingCallEl.classList.remove('show');
  callRef.set(null);
  window._pendingOffer = null;
});

function listenForCandidates(childPath){
  const ref = callRef.child(childPath);
  ref.on('child_added', snap => { const cand = snap.val(); if(pc && cand) pc.addIceCandidate(new RTCIceCandidate(cand)).catch(()=>{}); });
  if(childPath === 'callerCandidates') handledCallerCandidatesRef = ref; else handledCalleeCandidatesRef = ref;
}
function wireRemoteTrack(){
  const remoteStream = new MediaStream();
  remoteVideo.srcObject = remoteStream;
  pc.ontrack = e => { e.streams[0].getTracks().forEach(t => remoteStream.addTrack(t)); };
}
function openCallOverlay(isCaller){
  callActive = true; micOn = true; camOn = true;
  toggleMicBtn.classList.remove('off'); toggleCamBtn.classList.remove('off');
  localVideo.srcObject = localStream;
  callOverlay.classList.add('show');
  callStatusBar.textContent = isCaller ? 'Calling…' : 'Connecting…';
}
toggleMicBtn.addEventListener('click', () => { if(!localStream) return; micOn = !micOn; localStream.getAudioTracks().forEach(t => t.enabled = micOn); toggleMicBtn.classList.toggle('off', !micOn); });
toggleCamBtn.addEventListener('click', () => { if(!localStream) return; camOn = !camOn; localStream.getVideoTracks().forEach(t => t.enabled = camOn); toggleCamBtn.classList.toggle('off', !camOn); });
hangupBtn.addEventListener('click', () => endCall(false));
function endCall(silent){ if(callRef) callRef.set(null).catch(()=>{}); cleanupCall(); if(!silent) showToast('Call ended'); }
function cleanupCall(){
  stopRingtone(); callActive = false;
  if(pc){ pc.close(); pc = null; }
  if(localStream){ localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if(handledCallerCandidatesRef){ handledCallerCandidatesRef.off(); handledCallerCandidatesRef = null; }
  if(handledCalleeCandidatesRef){ handledCalleeCandidatesRef.off(); handledCalleeCandidatesRef = null; }
  callOverlay.classList.remove('show');
  remoteVideo.srcObject = null; localVideo.srcObject = null;
}
</script>

</body>
</html>
